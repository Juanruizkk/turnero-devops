# Stack DevOps local: Prometheus + Grafana + SonarQube
# Uso: docker compose -f docker-compose.devops.yml up -d
#
# URLs una vez levantado:
#   Prometheus: http://localhost:9090
#   Grafana:    http://localhost:3000  (admin / turnero2024)
#   SonarQube:  http://localhost:9000  (admin / admin → te pide cambiarlo)

services:

  prometheus:
    image: prom/prometheus:latest
    container_name: turnero_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    networks:
      - devops

  grafana:
    image: grafana/grafana:latest
    container_name: turnero_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: turnero2024
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - devops
    depends_on:
      - prometheus

  sonarqube:
    image: sonarqube:10-community
    container_name: turnero_sonarqube
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    networks:
      - devops

volumes:
  grafana_data:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:

networks:
  devops:
    name: turnero_devops
    driver: bridge
