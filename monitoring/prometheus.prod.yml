global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # API .NET 8 — mismo nombre de contenedor que Dokploy asigna
  - job_name: 'turnero-api'
    static_configs:
      - targets: ['metaturnos-backend-tkhdjm.1.qnn6xp2w3si6tqewddd7xssdb:8080']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Métricas del servidor VPS (CPU, RAM, disco, red)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # Sondas HTTP a servicios externos
  - job_name: 'blackbox'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://api.resend.com                 # Resend API
          - https://metaturnos.com                 # Frontend producción
          - https://api.metaturnos.com/swagger     # API backend (swagger siempre responde 200 en prod si está habilitado)
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
